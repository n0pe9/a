<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07060a">
<title>Ascensão — 100 Andares</title>
<style>
:root{--bg:#07060a;--panel:#16121f;--fg:#ece6d6;--mut:#8f8799;--gold:#d8ab3c;--red:#c63c3c;--vz:#6a2fa0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:500px;margin:0 auto;padding-top:env(safe-area-inset-top)}
#hud{padding:10px 16px 6px;display:grid;gap:6px}
#row1{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
#floor{font-size:20px;color:var(--gold)}
#pots{font-size:15px}
#bar{height:10px;background:#2a1717;border-radius:5px;overflow:hidden}
#hp{height:100%;width:100%;background:var(--red);transition:width .2s}
#vz{font-size:13px;color:#b68de0}
#msg{font-size:13px;color:var(--mut);min-height:18px;line-height:1.3}
#cv{flex:1;min-height:0;width:100%;display:block}
#ctl{display:flex;gap:10px;padding:8px 16px calc(12px + env(safe-area-inset-bottom))}
button{flex:1;padding:14px;border:0;border-radius:12px;background:var(--panel);color:var(--fg);font-size:16px;font-weight:600;font-family:inherit}
button:disabled{opacity:.4}
#end{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#end.on{display:flex}
#end div{max-width:320px}
#end h1{font-size:28px;margin:0 0 10px;color:var(--gold)}
#end p{color:var(--mut);line-height:1.45;margin:0 0 20px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="row1"><span id="floor">Andar 100</span><span id="pots">🧪 2</span></div>
    <div id="bar"><div id="hp"></div></div>
    <div id="vz"></div>
    <div id="msg"></div>
  </div>
  <canvas id="cv"></canvas>
  <div id="ctl">
    <button id="bp">🧪 Poção</button>
    <button id="bw">⏳ Esperar</button>
  </div>
</div>
<div id="end"><div><h1 id="et"></h1><p id="ep"></p><button id="br">Recomeçar</button></div></div>

<script>
// ===== Ajustes de balanceamento =====
const COLS = 15, ROWS = 21, MAXF = 100;
const MULT_MIN = 0.5, MULT_MAX = 1.5;          // inimigos: fracos no Andar 1, fortes no Andar 100
const VZ_BASE = 0.5, VZ_GROWTH = 0.02, VZ_CAP = 1.6; // velocidade do Vazio por andar subido
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const TIERS = [
  { ch:'🐀', name:'Rato',      hp:4,  dmg:2 },
  { ch:'💀', name:'Esqueleto', hp:8,  dmg:3 },
  { ch:'👹', name:'Ogro',      hp:16, dmg:4 },
  { ch:'😈', name:'Demônio',   hp:26, dmg:6 },
];

const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
let W = 0, H = 0, T = 20, OX = 0, OY = 0;
let S = null, L = null, ps = null;

const inb = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const climbed = () => MAXF - S.floor;
const vzSpeed = () => Math.min(VZ_CAP, VZ_BASE + climbed() * VZ_GROWTH);
const vis = (x, y) => (x - S.px) ** 2 + (y - S.py) ** 2 <= 36;

// ===== Tela =====
function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  T = Math.floor(Math.min(W / COLS, H / ROWS));
  OX = Math.floor((W - T * COLS) / 2);
  OY = Math.floor((H - T * ROWS) / 2);
}
addEventListener('resize', resize);

// ===== Geração de andar =====
function genFloor() {
  const map = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
  const rooms = [];
  for (let t = 0; t < 200 && rooms.length < 7; t++) {
    const w = 3 + rnd(4), h = 3 + rnd(3);
    const x = 1 + rnd(COLS - w - 2), y = 1 + rnd(ROWS - h - 2);
    const ok = rooms.every(r => x + w + 1 < r.x || r.x + r.w + 1 < x || y + h + 1 < r.y || r.y + r.h + 1 < y);
    if (!ok) continue;
    rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j][i] = 0;
  }
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    let x = a.cx, y = a.cy;
    while (x !== b.cx) { map[y][x] = 0; x += Math.sign(b.cx - x); }
    while (y !== b.cy) { map[y][x] = 0; y += Math.sign(b.cy - y); }
    map[y][x] = 0;
  }
  return { map, rooms };
}

function bfs(sx, sy) {
  const d = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  const par = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const q = [[sx, sy]]; d[sy][sx] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (inb(nx, ny) && d[ny][nx] < 0 && L.map[ny][nx] === 0) {
        d[ny][nx] = d[y][x] + 1; par[ny][nx] = [x, y]; q.push([nx, ny]);
      }
    }
  }
  return { d, par };
}

function reveal() {
  for (let y = S.py - 6; y <= S.py + 6; y++)
    for (let x = S.px - 6; x <= S.px + 6; x++)
      if (inb(x, y) && vis(x, y)) L.disc[y][x] = true;
}

function loadFloor() {
  let G;
  do { G = genFloor(); } while (G.rooms.length < 3);
  const { map, rooms } = G;
  const m = MULT_MIN + (MULT_MAX - MULT_MIN) * (S.floor - 1) / 99;   // escala por andar
  const maxTier = 1 + (S.floor - 1) / 30;
  L = { map, mons: [], items: [], vz: null,
        disc: Array.from({ length: ROWS }, () => Array(COLS).fill(false)) };

  const start = rooms[0], exit = rooms[rooms.length - 1];
  S.px = start.cx; S.py = start.cy;
  L.sx = exit.cx; L.sy = exit.cy;

  for (let r = 1; r < rooms.length; r++) {
    const R = rooms[r];
    const n = 1 + rnd(2) + (S.floor > 50 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const t = TIERS[Math.min(TIERS.length - 1, Math.floor(Math.random() * maxTier))];
      const x = R.x + rnd(R.w), y = R.y + rnd(R.h);
      if (L.mons.some(q => q.x === x && q.y === y) || (x === L.sx && y === L.sy)) continue;
      const hp = Math.max(1, Math.round(t.hp * m));
      L.mons.push({ x, y, ch: t.ch, name: t.name, hp, max: hp, dmg: Math.max(1, Math.round(t.dmg * m)) });
    }
  }
  for (let k = 0, n = 1 + rnd(2); k < n; k++) {
    const R = pick(rooms.slice(1)), x = R.x + rnd(R.w), y = R.y + rnd(R.h);
    if (!(x === L.sx && y === L.sy) && !L.items.some(i => i.x === x && i.y === y)) L.items.push({ x, y });
  }

  // O Vazio nasce no ponto mais distante do jogador (caminho real).
  const d = bfs(S.px, S.py).d;
  let best = -1, cand = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (d[y][x] < 0) continue;
    if (d[y][x] > best) { best = d[y][x]; cand = [[x, y]]; }
    else if (d[y][x] === best) cand.push([x, y]);
  }
  const [vx, vy] = pick(cand);
  L.vz = { x: vx, y: vy, acc: 0 };
  L.mons = L.mons.filter(q => !(q.x === vx && q.y === vy));

  reveal();
}

// ===== Turnos =====
function say(t) { $('msg').textContent = t; }

function act(dx, dy) {
  if (!S || S.over) return;
  const nx = S.px + dx, ny = S.py + dy;
  if (!inb(nx, ny) || L.map[ny][nx] === 1) return;

  const m = L.mons.find(q => q.x === nx && q.y === ny);
  if (m) {
    const dmg = S.atk + rnd(3);
    m.hp -= dmg;
    if (m.hp <= 0) {
      L.mons = L.mons.filter(q => q !== m);
      say(`Você derrota ${m.name}.`);
      if (Math.random() < 0.25) L.items.push({ x: m.x, y: m.y });
    } else say(`Você acerta ${m.name} (${dmg}).`);
    return endTurn();
  }

  S.px = nx; S.py = ny;
  if (nx === L.sx && ny === L.sy) {
    if (S.floor === 1) return win();
    S.floor--;
    say(`Você sobe para o Andar ${S.floor}. O Vazio acelera.`);
    loadFloor();
    return refresh();
  }
  const ii = L.items.findIndex(i => i.x === nx && i.y === ny);
  if (ii >= 0) { L.items.splice(ii, 1); S.pots++; say('Você pega uma poção.'); }
  reveal();
  endTurn();
}

function endTurn() {
  // Monstros
  for (const m of [...L.mons]) {
    if (S.over) return;
    if (!L.mons.includes(m)) continue;
    const dist = Math.abs(m.x - S.px) + Math.abs(m.y - S.py);
    if (dist === 1) {
      const dmg = Math.max(1, m.dmg - S.def);
      S.hp -= dmg;
      say(`${m.name} te acerta (${dmg}).`);
      if (S.hp <= 0) return die(`Morto por ${m.name}.`);
      continue;
    }
    if (dist <= 7) {
      let best = null, bd = dist;
      for (const [dx, dy] of DIRS) {
        const x = m.x + dx, y = m.y + dy;
        if (!inb(x, y) || L.map[y][x] === 1 || (x === S.px && y === S.py)) continue;
        if (L.mons.some(q => q !== m && q.x === x && q.y === y)) continue;
        if (x === L.vz.x && y === L.vz.y) continue;
        const nd = Math.abs(x - S.px) + Math.abs(y - S.py);
        if (nd < bd) { bd = nd; best = [x, y]; }
      }
      if (best) { m.x = best[0]; m.y = best[1]; }
    }
  }

  // O Vazio: persegue o jogador pelo caminho mais curto e devora o que encontra.
  const v = L.vz;
  v.acc += vzSpeed();
  if (v.acc >= 1) {
    const { d } = bfs(S.px, S.py);
    while (v.acc >= 1) {
      v.acc -= 1;
      let next = null, bd = d[v.y][v.x];
      for (const [dx, dy] of DIRS) {
        const x = v.x + dx, y = v.y + dy;
        if (!inb(x, y) || d[y][x] < 0) continue;
        if (d[y][x] < bd) { bd = d[y][x]; next = [x, y]; }
      }
      if (!next) break;
      v.x = next[0]; v.y = next[1];
      if (v.x === S.px && v.y === S.py) return die('Engolido pelo Vazio.');
      const mi = L.mons.findIndex(q => q.x === v.x && q.y === v.y);
      if (mi >= 0) { L.mons.splice(mi, 1); say('O Vazio devora um monstro.'); }
    }
  }
  refresh();
}

function wait() { if (S && !S.over) { say('Você espera.'); endTurn(); } }

function potion() {
  if (!S || S.over || S.pots <= 0 || S.hp >= S.maxhp) return;
  S.pots--; S.hp = Math.min(S.maxhp, S.hp + 12);
  say('Você bebe uma poção (+12).');
  endTurn();
}

function stepTowards(tx, ty) {
  const { par } = bfs(S.px, S.py);
  if (!par[ty][tx]) return;
  let cur = [tx, ty];
  while (par[cur[1]][cur[0]] && !(par[cur[1]][cur[0]][0] === S.px && par[cur[1]][cur[0]][1] === S.py))
    cur = par[cur[1]][cur[0]];
  act(cur[0] - S.px, cur[1] - S.py);
}

function die(reason) {
  S.over = true;
  showEnd('Fim da linha', `${reason} Você chegou ao Andar ${S.floor} após subir ${climbed()} andares.`);
  refresh();
}

function win() {
  S.over = true;
  showEnd('Você saiu da masmorra!', 'Você subiu os 100 andares e escapou pela saída do Andar 1.');
  refresh();
}

function showEnd(t, p) { $('et').textContent = t; $('ep').textContent = p; $('end').classList.add('on'); }

// ===== HUD =====
function refresh() {
  if (!S || !L) return;
  $('floor').textContent = `Andar ${S.floor}`;
  $('pots').textContent = `🧪 ${S.pots}`;
  $('hp').style.width = Math.max(0, S.hp / S.maxhp * 100) + '%';
  $('bp').disabled = S.over || S.pots <= 0 || S.hp >= S.maxhp;
  $('bw').disabled = S.over;
  const d = bfs(S.px, S.py).d[L.vz.y][L.vz.x];
  $('vz').textContent = `🌑 Vazio a ${d >= 0 ? d : '?'} passos · ritmo ${vzSpeed().toFixed(2)}x · subindo ${climbed()}/99`;
}

// ===== Desenho =====
function glyph(ch, x, y, scale = 0.75) {
  g.font = `${Math.floor(T * scale)}px "Apple Color Emoji","Segoe UI Emoji",system-ui,sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(ch, OX + x * T + T / 2, OY + y * T + T / 2 + 1);
}

function draw() {
  g.fillStyle = '#07060a';
  g.fillRect(0, 0, W, H);
  if (!S || !L) return;

  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const px = OX + x * T, py = OY + y * T;
    if (!L.disc[y][x]) { g.fillStyle = '#030204'; g.fillRect(px, py, T, T); continue; }
    const wall = L.map[y][x] === 1;
    g.fillStyle = wall ? '#2c2536' : '#171320';
    g.fillRect(px + 0.5, py + 0.5, T - 1, T - 1);
    if (!wall && x === L.sx && y === L.sy) glyph('🪜', x, y);
  }
  for (const i of L.items) if (L.disc[i.y][i.x]) glyph('🧪', i.x, i.y, 0.6);
  for (const m of L.mons) if (vis(m.x, m.y)) glyph(m.ch, m.x, m.y);
  glyph('🧗', S.px, S.py, 0.8);

  // Sombra do Vazio: sempre visível, pulsa, cobre o que está perto dele.
  const v = L.vz, cx = OX + v.x * T + T / 2, cy = OY + v.y * T + T / 2;
  const pulse = 1 + 0.08 * Math.sin(performance.now() / 300);
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, T * 3 * pulse);
  gr.addColorStop(0, 'rgba(70,20,100,0.85)');
  gr.addColorStop(1, 'rgba(70,20,100,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(cx, cy, T * 3 * pulse, 0, Math.PI * 2); g.fill();
  glyph('🌑', v.x, v.y, 0.9);
}

function loop() { draw(); requestAnimationFrame(loop); }

// ===== Controles =====
cv.addEventListener('pointerdown', e => { ps = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', e => {
  if (!ps || !S || S.over) return;
  const dx = e.clientX - ps.x, dy = e.clientY - ps.y; ps = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {        // deslize = mover 1 casa
    if (Math.abs(dx) > Math.abs(dy)) act(Math.sign(dx), 0);
    else act(0, Math.sign(dy));
    return;
  }
  const r = cv.getBoundingClientRect();
  const tx = Math.floor((e.clientX - r.left - OX) / T), ty = Math.floor((e.clientY - r.top - OY) / T);
  if (!inb(tx, ty)) return;
  const dist = Math.abs(tx - S.px) + Math.abs(ty - S.py);
  if (dist === 1) act(tx - S.px, ty - S.py);             // toque na casa vizinha
  else if (dist > 1) stepTowards(tx, ty);                // toque distante = 1 passo no caminho
});

addEventListener('keydown', e => {
  const map = { ArrowUp:[0,-1], w:[0,-1], W:[0,-1], ArrowDown:[0,1], s:[0,1], S:[0,1],
                ArrowLeft:[-1,0], a:[-1,0], A:[-1,0], ArrowRight:[1,0], d:[1,0], D:[1,0] };
  const k = map[e.key];
  if (k) { e.preventDefault(); act(k[0], k[1]); }
  else if (e.key === ' ') { e.preventDefault(); wait(); }
  else if (e.key === 'p' || e.key === 'P') potion();
});

$('bp').onclick = potion;
$('bw').onclick = wait;
$('br').onclick = newRun;

function newRun() {
  S = { floor: MAXF, hp: 40, maxhp: 40, atk: 8, def: 3, pots: 2, over: false };
  loadFloor();
  $('end').classList.remove('on');
  say('Você cai no fundo da masmorra. Equipado: Lâmina do Primeiro Rei e Armadura Dracônica. Suba até o Andar 1.');
  refresh();
}

resize();
newRun();
loop();
</script>
</body>
</html>
